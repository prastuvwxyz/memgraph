version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - goimports
    - revive
    - gocritic

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable:
        - shadow
        - printf
        - structtag
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy

issues:
  exclude-rules:
    - linters: [errcheck]
      text: 'Error return value of .*(Close|Flush) is not checked'
  max-issues-per-linter: 0
  max-same-issues: 0
